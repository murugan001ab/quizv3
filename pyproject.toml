[project]
name = "quiz-app"
version = "0.1.0"
description = "MCQ Quiz platform with Admin & User panels"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "python-jose[cryptography]",
    "bcrypt==4.0.1",
    "python-multipart",
    "pydantic[email]",
    "asyncpg",
    "websockets",
    "python-dotenv",
    "imagekitio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi-cli.run]
app = "app.main:app"
